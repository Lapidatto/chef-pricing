[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chef-pricing"
dynamic = ["version"]
description = "Desktop application for restaurant dish costing and pricing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7,<7",
  "pydantic>=2.7,<3",
  "pandas>=2.2,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
]
build = [
  "pyinstaller>=6.7,<7",
]

[project.scripts]
chef-pricing = "chef_pricing.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chef_pricing = ["frontend/resources/*.qss"]

[tool.setuptools.dynamic]
version = {attr = "chef_pricing.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
